<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Weather Dashboard</title>
  
  <!-- PWA & Mobile Meta Tags -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/1163/1163661.png">

  <style>
    :root {
      --bg-color: #000000;
      --card-bg: #111111;
      --accent-color: #ff9800;
      --text-color: #ffffff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 12px;
      padding-bottom: 40px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding: 4px;
    }

    h1 {
      font-size: 1.1rem;
      color: var(--accent-color);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .refresh-btn {
      background: #222;
      color: #fff;
      border: 1px solid #444;
      padding: 6px 12px;
      border-radius: 16px;
      font-size: 0.8rem;
      cursor: pointer;
    }

    /* Responsive Grid: 1 Col (Mobile) -> 2 Col (Tablet) -> 3 Col (Desktop) */
    .dashboard-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }

    @media (min-width: 600px) { .dashboard-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (min-width: 1024px) { .dashboard-grid { grid-template-columns: repeat(3, 1fr); } }

    .card {
      background: var(--card-bg);
      border: 1px solid #222;
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .card-title {
      font-size: 0.85rem;
      font-style: italic;
      color: var(--accent-color);
      padding: 8px 10px;
      background: #181818;
      border-bottom: 1px solid #222;
    }

    .img-container {
      width: 100%;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 180px;
      cursor: pointer;
    }

    .card img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: contain;
    }

    /* Modal for Tap-to-Expand */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.95);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      padding: 16px;
    }

    .modal.active { display: flex; }
    .modal img { max-width: 100%; max-height: 85vh; object-fit: contain; }
    .modal-title { color: var(--accent-color); margin-top: 12px; font-size: 0.95rem; }

    /* Toast Notification */
    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #222;
      border: 1px solid #444;
      color: #fff;
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 0.8rem;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
    }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>

  <header>
    <h1>Live Weather</h1>
    <button class="refresh-btn" onclick="refreshImages(true)">⚡ Refresh</button>
  </header>

  <main class="dashboard-grid" id="grid"></main>

  <div class="modal" id="modal" onclick="closeModal()">
    <img id="modal-img" src="" alt="Expanded Map">
    <div class="modal-title" id="modal-title"></div>
  </div>

  <div class="toast" id="toast">Maps Updated</div>

  <script>
    const gifData = [
      { label: "Continental US - Geo Color", url: "https://cdn.star.nesdis.noaa.gov/GOES19/GLM/CONUS/EXTENT3/GOES19-CONUS-EXTENT3-625x375.gif" },
      { label: "Florida - Geo Color", url: "https://cdn.star.nesdis.noaa.gov/GOES19/ABI/SECTOR/SE/GEOCOLOR/GOES19-SE-GEOCOLOR-600x600.gif" },
      { label: "Tropical - Geo Color", url: "https://cdn.star.nesdis.noaa.gov/GOES19/ABI/SECTOR/taw/GEOCOLOR/GOES19-TAW-GEOCOLOR-900x540.gif" },
      { label: "Continental US - Radar", url: "https://radar.weather.gov/ridge/standard/CONUS-LARGE_loop.gif" },
      { label: "South-East US - Radar", url: "https://radar.weather.gov/ridge/standard/SOUTHEAST_loop.gif" },
      { label: "Florida - Radar", url: "https://radar.weather.gov/ridge/standard/KMLB_loop.gif" },
      { label: "Lightning (Previous 2 Hours)", url: "https://images.lightningmaps.org/blitzortung/america/index.php?animation=usa" },
      { label: "Pressure Map", url: "https://www.wpc.ncep.noaa.gov/images/wwd/radnat/NATRAD_24.gif" },
      { label: "Wind Chill / Heat Index", url: "https://data.mesonet.org/data/public/noaa/metar/maps/realtime/latest.tapp.png" }
    ];

    function initDashboard() {
      const grid = document.getElementById("grid");
      grid.innerHTML = "";

      gifData.forEach((item, index) => {
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
          <div class="card-title">${item.label}</div>
          <div class="img-container" onclick="openModal('${item.label}', ${index})">
            <img id="img-${index}" src="${getCacheBustedUrl(item.url)}" alt="${item.label}" loading="lazy">
          </div>
        `;
        grid.appendChild(card);
      });

      // Auto-refresh every 10 minutes
      setInterval(() => refreshImages(false), 600000);
    }

    function getCacheBustedUrl(url) {
      const sep = url.includes("?") ? "&" : "?";
      return `${url}${sep}t=${Date.now()}`;
    }

    function refreshImages(manual = false) {
      gifData.forEach((item, index) => {
        const img = document.getElementById(`img-${index}`);
        if (img) img.src = getCacheBustedUrl(item.url);
      });

      if (manual) showToast("Weather maps refreshed");
    }

    function openModal(label, index) {
      const modalImg = document.getElementById("modal-img");
      modalImg.src = document.getElementById(`img-${index}`).src;
      document.getElementById("modal-title").textContent = label;
      document.getElementById("modal").classList.add("active");
    }

    function closeModal() {
      document.getElementById("modal").classList.remove("active");
    }

    function showToast(msg) {
      const toast = document.getElementById("toast");
      toast.textContent = msg;
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 2000);
    }

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }

    window.onload = initDashboard;
  </script>
</body>
</html>
